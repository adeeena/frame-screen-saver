<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1a2a4a"/>
      <stop offset="60%" stop-color="#c97a3a"/>
      <stop offset="100%" stop-color="#e8a055"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#f0bc75" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f0bc75" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="artwork-clip">
      <rect x="7" y="7" width="18" height="18" rx="0.5"/>
    </clipPath>
  </defs>

  <!-- Outer frame body — dark navy -->
  <rect x="1" y="1" width="30" height="30" rx="2" fill="#101018"/>

  <!-- Frame bevel highlight (top-left) -->
  <rect x="1" y="1" width="30" height="30" rx="2"
        fill="none" stroke="#2a2a38" stroke-width="1"/>

  <!-- Gold frame border -->
  <rect x="2.5" y="2.5" width="27" height="27" rx="1.5"
        fill="none" stroke="#f0bc75" stroke-width="1.2" opacity="0.9"/>

  <!-- Inner bevel line -->
  <rect x="4.5" y="4.5" width="23" height="23" rx="1"
        fill="none" stroke="#c89050" stroke-width="0.4" opacity="0.6"/>

  <!-- White mat -->
  <rect x="5.5" y="5.5" width="21" height="21" rx="0.5" fill="#f5efe0"/>

  <!-- Artwork image (clipped) — golden hour landscape -->
  <g clip-path="url(#artwork-clip)">
    <!-- Sky gradient -->
    <rect x="7" y="7" width="18" height="18" fill="url(#sky)"/>

    <!-- Distant treeline silhouette -->
    <rect x="7"  y="17.5" width="18" height="7.5" fill="#0d1520"/>
    <polygon points="7,17.5 9,14.5 11,17.5"  fill="#0d1520"/>
    <polygon points="9,17.5 11,13.5 13,17.5"  fill="#0d1520"/>
    <polygon points="11.5,17.5 14,12.5 16.5,17.5" fill="#0d1520"/>
    <polygon points="14,17.5 16,14 18,17.5"   fill="#0d1520"/>
    <polygon points="17,17.5 19,13.8 21,17.5"  fill="#0d1520"/>
    <polygon points="19.5,17.5 21.5,15.5 23,17.5" fill="#0d1520"/>
    <polygon points="22,17.5 24,14.5 25,17.5"  fill="#0d1520"/>

    <!-- Sun / horizon glow -->
    <ellipse cx="16" cy="17.5" rx="5" ry="2.5"
             fill="#f0bc75" opacity="0.55"/>
    <circle  cx="16" cy="17.5" r="1.5"
             fill="#fff4d0" opacity="0.9"/>
  </g>

  <!-- Mat inner shadow (top + left) -->
  <rect x="5.5" y="5.5" width="21" height="21" rx="0.5"
        fill="none" stroke="#c8b890" stroke-width="0.5" opacity="0.4"/>

  <!-- Subtle ambient glow overlay on frame -->
  <rect x="1" y="1" width="30" height="30" rx="2" fill="url(#glow)"/>
</svg>
