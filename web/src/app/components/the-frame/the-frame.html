<!-- ① Outer frame (museum border) -->
<div class="the-frame__outer"
     [class.the-frame--style-1]="frameStyle === 1"
     [class.the-frame--style-2]="frameStyle === 2"
     [class.the-frame--style-3]="frameStyle === 3"
     [class.the-frame--style-4]="frameStyle === 4"
     (mousemove)="onMouseMove()">

  <!-- Pause progress bar — 3px tall, top of screen, full width -->
  <div class="the-frame__progress-bar" #progressBar
       [class.the-frame__progress-bar--visible]="isPaused">
  </div>

  <!-- Mat linen texture — shows only in the white mat border area via ring mask -->
  <div class="the-frame__mat-texture" aria-hidden="true"></div>

  <!-- Global dim overlay — covers full frame incl. mat, adjusted with I/O keys -->
  <div class="the-frame__dim" [style.opacity]="dimLevel" aria-hidden="true"></div>

  <!-- Config cog button — appears on mouse movement, fades after 3s -->
  <button class="the-frame__cog-btn"
          [class.the-frame__cog-btn--visible]="showCog"
          (click)="navigateToConfig()"
          aria-label="Open configuration">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="currentColor" d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.92c.04-.34.07-.69.07-1.08s-.03-.74-.07-1.08l2.32-1.82a.55.55 0 0 0 .13-.71l-2.2-3.82a.545.545 0 0 0-.68-.24l-2.73 1.1c-.57-.44-1.18-.8-1.86-1.07l-.42-2.9A.54.54 0 0 0 13.5 2h-4.4c-.26 0-.48.18-.52.43l-.41 2.9c-.68.27-1.3.63-1.86 1.07l-2.74-1.1a.532.532 0 0 0-.67.24L.68 9.36c-.14.24-.08.53.13.71l2.32 1.82C3.05 12.26 3 12.61 3 13s.05.74.09 1.08L.77 15.9a.547.547 0 0 0-.13.71l2.2 3.82c.14.24.43.33.68.24l2.73-1.1c.57.44 1.18.8 1.86 1.07l.42 2.9c.04.25.26.43.52.43h4.4c.26 0 .49-.18.52-.43l.42-2.9c.68-.27 1.3-.63 1.86-1.07l2.74 1.1c.25.09.53 0 .67-.24l2.2-3.82a.55.55 0 0 0-.13-.71z"/>
    </svg>
  </button>

  <!-- ② Inner frame (white mat) -->
  <div class="the-frame__inner">

    <!-- Grain texture -->
    <div class="the-frame__grain" aria-hidden="true"></div>

    <!-- ③ Image layers (A/B crossfade) -->
    <div class="the-frame__image the-frame__image--a" #imageA></div>
    <div class="the-frame__image the-frame__image--b" #imageB></div>

    <!-- Vignette — always-on corner darkening on the artwork -->
    <div class="the-frame__vignette" aria-hidden="true"></div>

    <!-- ④ Info overlay (pages 2 + 3) -->
    <div class="the-frame__overlay" #infoOverlay>

      <!-- Dark scrim over image when info is shown -->
      <div class="the-frame__scrim" aria-hidden="true"></div>

      <!-- Page 2: Cover -->
      <app-cover-page #coverPage class="the-frame__page"></app-cover-page>

      <!-- Page 3: Columns -->
      <app-columns-page #columnsPage class="the-frame__page" [sidebarLayout]="sidebarLayout"></app-columns-page>

    </div><!-- /overlay -->

    <!-- Debug overlay -->
    <app-debug-overlay *ngIf="showDebug" (close)="showDebug = false"></app-debug-overlay>

  </div><!-- /inner -->
</div><!-- /outer -->
